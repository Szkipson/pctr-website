<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategoria | GOL-STORE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff5a00'/%3E%3Ctext x='50' y='72' font-size='62' font-weight='bold' font-style='italic' text-anchor='middle' fill='white' font-family='Arial'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <nav class="breadcrumbs" id="breadcrumbs" aria-label="Okruszki"></nav>

    <div class="listing-head">
      <div>
        <h1 id="listingTitle"></h1>
        <span class="listing-count" id="listingCount"></span>
      </div>
      <div class="listing-tools">
        <button class="btn btn-sm mobile-filters-btn" id="mobileFiltersBtn">Filtry</button>
        <label for="sortSelect" class="listing-count">Sortuj:</label>
        <select id="sortSelect">
          <option value="popular">Najpopularniejsze</option>
          <option value="price-asc">Cena: od najniższej</option>
          <option value="price-desc">Cena: od najwyższej</option>
          <option value="discount">Największy rabat</option>
          <option value="name">Nazwa A–Z</option>
        </select>
      </div>
    </div>

    <div class="active-filters" id="activeFilters"></div>

    <div class="listing">
      <aside class="filters" id="filters" aria-label="Filtry"></aside>
      <div>
        <div class="product-grid" id="productGrid"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/images.js"></script>
  <script src="js/common.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
